name: Release

# Publishes a GitHub Release (built site attached as a zip) for every pushed
# `v*` tag, or when run manually from `main` with a version: the run then
# creates tag v<version> on the commit it built. Without a version a manual
# run is a dry run (checks and build only). Deploys to GitHub Pages too when
# the repository variable DEPLOY_PAGES is "true". See docs/release.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release from main, e.g. 0.1.0 (creates tag v0.1.0).
          Leave empty for a dry run.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decide what to release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual releases must run on main (this run is on ${GITHUB_REF})" >&2
              exit 1
            fi
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Version '${INPUT_VERSION}' is not semver (e.g. 0.1.0)" >&2
              exit 1
            fi
            tag="v${INPUT_VERSION}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists; push a new version instead" >&2
              exit 1
            fi
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "Release tag: ${tag:-<none, dry run>}"

      - name: Check the tag matches the app version
        if: env.RELEASE_TAG != ''
        run: |
          version="$(node -p "require('./apps/web/package.json').version")"
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match apps/web/package.json version ${version}" >&2
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      - name: Rust checks
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets

      - name: Frontend checks and build
        run: |
          pnpm build:wasm
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Browser tests
        run: |
          pnpm --filter @schematic-ide/web exec playwright install --with-deps chromium
          pnpm --filter @schematic-ide/web test:e2e

      - name: Package the site
        run: |
          label="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          name="schematic-ide-${label//\//-}"
          (cd apps/web/dist && zip -qr "../../../${name}.zip" .)
          echo "ARCHIVE=${name}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Upload Pages artifact
        if: vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Create GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="$version" '
            /^## \[/ { printing = index($0, "## [" v "]") == 1; next }
            /^\[[^]]+\]: / { next }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # The release was created from the GitHub UI (which also pushed
            # the tag and started this run): attach the site and fill in the
            # notes instead of failing on "release already exists".
            gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Schematic IDE ${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            # A pushed tag already exists; a manual run creates the tag on
            # exactly the commit that was checked and built.
            verify=()
            [[ "$GITHUB_REF" == refs/tags/* ]] && verify=(--verify-tag)
            gh release create "$RELEASE_TAG" "$ARCHIVE" "${verify[@]}" \
              --target "$GITHUB_SHA" \
              --title "Schematic IDE ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi

  pages:
    if: vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
