[package]
name = "schematic-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
name = "schematic_wasm"
path = "src/lib.rs"

[dependencies]
schematic-core = { path = "../schematic-core" }
schematic-edit = { path = "../schematic-edit" }
schematic-analysis = { path = "../schematic-analysis" }
schematic-format = { path = "../schematic-format" }
schematic-validate = { path = "../schematic-validate" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
